# eBPF receiving side of the CloudWatch Agent, installed as
# /opt/aws/amazon-cloudwatch-agent/etc/ebpf/receiver.yaml (%config(noreplace)).
# start-amazon-cloudwatch-agent loads it (as the first -otelconfig) only when eBPF is
# enabled (etc/ebpf/enabled, created by "amazon-cloudwatch-agent-ctl -a enable-ebpf"; in a
# container also CWAGENT_EBPF_ENABLED=true). The eBPF process (ebpf/obi.yaml) pushes
# its RED metrics here over OTLP/gRPC on a Unix socket; this pipeline adds the AWS
# attributes, converts them to delta and sends them to CloudWatch with the agent's
# credentials. The socket is created by the agent, in var/ebpf (group cwagent; the agent
# creates it with umask 007), so only root and the cwagent group can connect.
# Every component and pipeline is named <type>/cwagent_ebpf...: the agent refuses to
# merge duplicate keys with other YAMLs in etc/amazon-cloudwatch-agent.d/.
#
#   CWAGENT_REGION  CloudWatch region (default us-west-2). Set by the agent's config
#                   translation (env-config.json) to the region the agent resolved for itself.
#   AWS_VPC_ID, AWS_SUBNET_ID  optional resource attributes (skipped when unset)
#
# Never use a double dollar sign in this file: cwagent expands it a second time
# and fails on the result.
receivers:
  otlp/cwagent_ebpf:
    protocols:
      grpc:
        endpoint: /opt/aws/amazon-cloudwatch-agent/var/ebpf/otlp.sock
        transport: unix

extensions:
  sigv4auth/cwagent_ebpf_monitoring:
    region: ${env:CWAGENT_REGION:-us-west-2}
    service: monitoring

processors:
  # AWS-flavored resource attributes. OBI's EC2 detection gives host.id / cloud.*.
  # host.ip is derived only from an ip-a-b-c-d EC2 hostname (not from a pod name);
  # VPC / subnet come in as AWS_VPC_ID / AWS_SUBNET_ID env and are skipped when unset.
  transform/cwagent_ebpf_aws:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["ec2.instance.id"], attributes["host.id"]) where attributes["host.id"] != nil
          - set(attributes["aws.account.id"], attributes["cloud.account.id"]) where attributes["cloud.account.id"] != nil
          - set(attributes["aws.region"], attributes["cloud.region"]) where attributes["cloud.region"] != nil
          - set(attributes["host.ip"], attributes["host.name"]) where attributes["host.name"] != nil and IsMatch(attributes["host.name"], "^ip-[0-9]+-[0-9]+-[0-9]+-[0-9]+")
          - replace_pattern(attributes["host.ip"], "[.].*", "") where attributes["host.ip"] != nil
          - replace_pattern(attributes["host.ip"], "^ip-", "") where attributes["host.ip"] != nil
          - replace_pattern(attributes["host.ip"], "-", ".") where attributes["host.ip"] != nil
          - set(attributes["aws.vpc.id"], "${env:AWS_VPC_ID}") where "${env:AWS_VPC_ID}" != ""
          - set(attributes["aws.subnet.id"], "${env:AWS_SUBNET_ID}") where "${env:AWS_SUBNET_ID}" != ""
      # Lambda Invoke by bare function name: OBI cannot know the account, so complete
      # aws.lambda.function.arn from the host's cloud.account.id (the caller's account
      # unless it uses cross-account credentials) + faas.invoked_region / _name.
      - context: datapoint
        statements:
          - set(attributes["aws.lambda.function.arn"], Concat(["arn:aws:lambda:", attributes["faas.invoked_region"], ":", resource.attributes["cloud.account.id"], ":function:", attributes["faas.invoked_name"]], "")) where attributes["aws.lambda.function.arn"] == nil and attributes["faas.invoked_name"] != nil and attributes["faas.invoked_region"] != nil and resource.attributes["cloud.account.id"] != nil
          - replace_pattern(attributes["aws.lambda.function.arn"], "^arn:aws:lambda:cn-", "arn:aws-cn:lambda:cn-") where attributes["aws.lambda.function.arn"] != nil
          - replace_pattern(attributes["aws.lambda.function.arn"], "^arn:aws:lambda:us-gov-", "arn:aws-us-gov:lambda:us-gov-") where attributes["aws.lambda.function.arn"] != nil
  # CloudWatch OTLP metrics require delta temporality; OBI emits cumulative.
  cumulativetodelta/cwagent_ebpf: {}
  # CloudWatch OTLP accepts at most 1000 datapoints per request.
  batch/cwagent_ebpf:
    timeout: 5s
    send_batch_size: 500
    send_batch_max_size: 500

exporters:
  # otlp_http compresses with gzip by default.
  otlp_http/cwagent_ebpf_cloudwatch:
    metrics_endpoint: https://monitoring.${env:CWAGENT_REGION:-us-west-2}.amazonaws.com/v1/metrics
    auth:
      authenticator: sigv4auth/cwagent_ebpf_monitoring

service:
  extensions: [sigv4auth/cwagent_ebpf_monitoring]
  pipelines:
    metrics/cwagent_ebpf:
      receivers: [otlp/cwagent_ebpf]
      processors: [transform/cwagent_ebpf_aws, cumulativetodelta/cwagent_ebpf, batch/cwagent_ebpf]
      exporters: [otlp_http/cwagent_ebpf_cloudwatch]
