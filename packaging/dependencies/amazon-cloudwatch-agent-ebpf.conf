# systemd drop-in installed as
#   /etc/systemd/system/amazon-cloudwatch-agent.service.d/ebpf.conf
# by "amazon-cloudwatch-agent-ctl -a enable-ebpf" (eBPF is opt-in; the RPM ships
# this file as the template share/ebpf/systemd-dropin.conf; it must stay out of
# logs/ and var/, which ExecStartPre below chowns to cwagent).
# Runs the agent as the unprivileged cwagent user with only the capabilities the
# ADOT OBI eBPF receiver needs (raised as ambient, so they survive the exec of the
# agent binary). start-amazon-cloudwatch-agent skips its own run_as_user switch
# when it is not started as root.
# Capabilities: the lines below list every capability the eBPF receiver can
# use. "amazon-cloudwatch-agent-ctl -a enable-ebpf" (and the RPM / install.sh on
# upgrade) writes this drop-in with only the tiers etc/ebpf/obi.yaml enables
# (start-amazon-cloudwatch-agent -ebpf-caps):
#   RED metrics (always): CAP_BPF CAP_PERFMON CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
#     CAP_CHECKPOINT_RESTORE CAP_NET_RAW
#   topology, ebpf.context_propagation (default tcp_service_name): CAP_NET_ADMIN,
#     CAP_SYS_ADMIN (FIONREAD compensation program on kernels with commit
#     929e30f93125: 6.6.128+, 6.12.75+, 6.18.14+, 6.19+)
#   Java agent injection, javaagent.enabled (default true; Java TLS: JSSE does not
#     use libssl): CAP_KILL (SIGQUIT starts the JVM attach listener),
#     CAP_SYS_ADMIN + CAP_SYS_CHROOT (setns into the JVM's net/ipc/mount
#     namespaces), CAP_SETUID + CAP_SETGID (the attach thread, only that thread,
#     switches to the JVM owner's uid/gid)
#   Node.js injection, nodejs.enabled (default config: false): CAP_KILL
# A feature whose capabilities are missing is disabled (logged); RED still works.
[Service]
User=cwagent
Group=cwagent
AmbientCapabilities=CAP_BPF CAP_PERFMON CAP_SYS_PTRACE CAP_DAC_READ_SEARCH CAP_CHECKPOINT_RESTORE CAP_NET_RAW CAP_NET_ADMIN CAP_SYS_ADMIN CAP_KILL CAP_SYS_CHROOT CAP_SETUID CAP_SETGID
CapabilityBoundingSet=CAP_BPF CAP_PERFMON CAP_SYS_PTRACE CAP_DAC_READ_SEARCH CAP_CHECKPOINT_RESTORE CAP_NET_RAW CAP_NET_ADMIN CAP_SYS_ADMIN CAP_KILL CAP_SYS_CHROOT CAP_SETUID CAP_SETGID
LimitMEMLOCK=infinity
# "+" runs these steps as root.
# The config (etc/: the JSON from the ctl, common-config.toml, the eBPF config
# etc/ebpf/obi.yaml) must stay changeable by root only: the agent runs with the
# eBPF capabilities, and its config decides what it captures and where it sends
# it. So root translates the JSON into etc/amazon-cloudwatch-agent.{toml,yaml}
# here, the agent (as cwagent) does not, and etc/ is root-owned, readable but not
# writable by the cwagent group (this also restores hosts where an earlier beta
# chowned etc/ to cwagent). The launcher refuses an eBPF config that is not
# root-owned or is group/world-writable.
ExecStartPre=+/opt/aws/amazon-cloudwatch-agent/bin/start-amazon-cloudwatch-agent -translate-only
ExecStartPre=+/bin/chown -R root:cwagent /opt/aws/amazon-cloudwatch-agent/etc
ExecStartPre=+/bin/chmod -R g+rX,g-w,o-w /opt/aws/amazon-cloudwatch-agent/etc
# The agent writes logs/ and var/ (after the translation, which logs as root).
ExecStartPre=+/bin/chown -R cwagent:cwagent /opt/aws/amazon-cloudwatch-agent/logs /opt/aws/amazon-cloudwatch-agent/var
# OBI pins maps shared with other OTel eBPF components under /sys/fs/bpf/otel.
# /sys/fs/bpf is root-only: prepare that one directory (and any pins a previous
# root run left there) for cwagent, or OBI fails with "load pinned map: permission
# denied" (existing root-owned dir) or runs with pinning disabled (no dir).
# "-": without bpffs (/sys/fs/bpf not mounted) these fail; the agent still starts
# and OBI runs with pinning disabled.
ExecStartPre=-+/bin/mkdir -p /sys/fs/bpf/otel
ExecStartPre=-+/bin/chown -R cwagent:cwagent /sys/fs/bpf/otel
