# Default ADOT OBI eBPF config shipped by the RPM as
#   /opt/aws/amazon-cloudwatch-agent/etc/ebpf/obi.yaml   (%config(noreplace))
# It lives outside etc/amazon-cloudwatch-agent.d/ so that
# `amazon-cloudwatch-agent-ctl -a fetch-config` (which empties that dir) keeps it.
# eBPF is opt-in: start-amazon-cloudwatch-agent passes it as the FIRST
# -otelconfig only when etc/ebpf/enabled exists.
#
# To change it, edit this file: rpm upgrades keep your edits.
# A YAML in etc/amazon-cloudwatch-agent.d/ CANNOT override the components defined
# here: the agent refuses to merge duplicate keys under receivers, processors,
# exporters, extensions and service::pipelines, and fails to start with
#   E! Error running agent: failed to merge OTEL configs: merge conflict in receivers: [obi/cwagent_ebpf]
# Such a YAML may only add components with different names. Every component and
# pipeline here is named <type>/cwagent_ebpf... so that other YAMLs do not collide.
# To turn eBPF on / off:
#   amazon-cloudwatch-agent-ctl -a enable-ebpf
#   amazon-cloudwatch-agent-ctl -a disable-ebpf
#
#   CWAGENT_REGION  CloudWatch region (default us-west-2). Set by the agent's config
#                   translation (env-config.json) to the region the agent resolved for itself:
#                   agent.region, credentials profile / AWS_REGION, EC2 / ECS metadata, else the
#                   AWS_REGION environment variable. eBPF data goes to the agent's region.
#   CWAGENT_RUNTIME_PARAMETER      SSM parameter (String, in CWAGENT_REGION) with the runtime
#                   switches, e.g. AmazonCloudWatch-agent-runtime; empty (default) = no polling,
#                   no AWS call, every switch keeps its default (off).
#   CWAGENT_RUNTIME_POLL_INTERVAL  how often it is read (default 300s, +-20% jitter, >= 10s).
#                   On EC2 both come from etc/ebpf/runtime.env (EnvironmentFile of the eBPF
#                   systemd drop-in; written by the SSM Distributor package's
#                   SSM_RUNTIME_PARAMETER / SSM_RUNTIME_POLL_INTERVAL), in containers from
#                   the container's environment.
#
# Signals:
#   RED metrics  always on: pipeline metrics/cwagent_ebpf -> CloudWatch OTLP metrics.
#   Spans        runtime switch traces_export (default off): traces/cwagent_ebpf -> X-Ray OTLP
#                endpoint (needs Transaction Search, i.e. trace segment destination
#                CloudWatchLogs; the role needs xray:PutTraceSegments / PutSpans).
#   EMF          runtime switch emf_export (default off): metrics/cwagent_ebpf_emf -> EMF logs
#                in /aws/cwagent/ebpf, metrics in namespace CWAgent/eBPF.
#   The switches are read by extension runtimecontrol/cwagent_ebpf from the SSM parameter, a
#   JSON object such as {"version":1,"traces_export":false,"emf_export":false}, and applied by
#   the gate processors without restarting the agent. A value that cannot be read (missing
#   parameter, invalid JSON, no permission, throttling) keeps the last values (W! in the log).
#
# Never use a double dollar sign in this file: cwagent expands it a second time
# and fails on the result.
receivers:
  obi/cwagent_ebpf:
    ebpf:
      bpf_fs_base_dir: /sys/fs/bpf
      # Servers return their service.name to the client in a TCP option (kind 26,
      # patch 01) -> peer.service.name; also cwagent's obi receiver default. Only
      # to peers inside the VPC unless tcp_service_name_outside_vpc: true. No trace
      # context and no HTTP header injection: the application payload is never modified.
      context_propagation: "tcp_service_name"
      # false (OBI's default): a server request ends when its response is complete.
      # true submits it at the first response write, which dropped ~31% of
      # requests whose downstream calls were slow or timed out (ping demo, 2026-10-09).
      high_request_volume: false
      # AWS SDK calls: the upstream S3 / SQS / Lambda parsers (they need the large HTTP
      # buffer) add aws.s3.bucket, aws.sqs.queue.url, faas.invoked_name / _region and
      # aws.lambda.function.arn to HTTP client RED metrics; the Lambda transform below
      # uses them.
      buffer_sizes:
        http: 8192
      payload_extraction:
        http:
          aws:
            enabled: true
      # Halve every resizable BPF map (OBI scales sizes by 2^factor, -3..3) to
      # save kernel memory; 0 = upstream sizes.
      maps_config:
        global_scale_factor: -1
    # One filter for EC2, ECS and EKS. Within an entry all keys must match (AND);
    # a process is picked when any instrument entry matches (OR) and no
    # exclude_instrument entry does (exclude wins). k8s_* keys never match a process
    # without Kubernetes metadata, so those entries are inert on EC2 / ECS.
    discovery:
      # A process without OTEL_SERVICE_NAME is named from its package.json /
      # pyproject.toml / JAR / main class / script instead of python3, node,
      # java; Kubernetes names still win. false = upstream (executable) naming.
      service_name_from_cmdline: true
      # false: keep eBPF RED for processes that also export OTel data with an SDK
      # (e.g. Application Signals); upstream true drops all of their eBPF events.
      exclude_otel_instrumented_services: false
      instrument:
        # EC2 / ECS: common service ports (ping: 8000; eks-auto: 8080-8083, 8443).
        # OBI matches every local inet port of a process, not only listeners, so keep
        # ranges below the ephemeral range (32768-60999). Not an env var: a
        # single-port value would be typed as an int and rejected by OBI.
        # exports: "metrics,traces": OBI builds RED metrics and spans. Spans only leave
        # the agent while the runtime switch traces_export is on (gate/cwagent_ebpf_traces);
        # "metrics" alone = no spans built at all (switch has no effect, a little less CPU).
        - open_ports: "80,443,3000,5000,8000-8099,8443,8888,9000"
          exports: "metrics,traces"
        # EKS: every Deployment / StatefulSet pod, whatever its ports.
        - k8s_deployment_name: "*"
          exports: "metrics,traces"
        - k8s_statefulset_name: "*"
          exports: "metrics,traces"
      # Added to OBI's built-in excludes (obi / otelcol* executables and the
      # kube-system, kube-node-lease, cert-manager, monitoring, ... namespaces).
      exclude_instrument:
        # Self and other agents/proxies. OBI's built-ins do not cover cwagent.
        - exe_path: "{*/amazon-cloudwatch-agent*,*/envoy*,*otelcol*,*/aws-otel-collector*}"
        - k8s_namespace: "{amazon-cloudwatch,amazon-guardduty,aws-observability,karpenter,kube-public}"
        # Node agents: also stops the port rule from picking up DaemonSet pods.
        - k8s_daemonset_name: "*"
        # EKS add-ons.
        - k8s_pod_labels:
            eks.amazonaws.com/component: "*"
    attributes:
      kubernetes:
        # On in EKS, off on plain EC2 ("true" would fail without a cluster).
        enable: "autodetect"
    metrics:
      features: "application"
    # No Node.js injector (SIGUSR1 + inspector + injected JS): RED does not need it,
    # the socket / libssl probes count every request without it. On a node binary it
    # cost +340 us CPU per request and cut max throughput from 42k to 2.8k RPS on
    # c6i.2xlarge; disabled: +14 us, 25k RPS, RED exact (perf-ec2, 2026-10-23).
    nodejs:
      enabled: false
    # Java HTTPS (JSSE does not use OpenSSL): a small Java agent is loaded into each
    # instrumented JVM through the attach API. false: no injection, no Java HTTPS
    # RED, and enable-ebpf no longer grants CAP_SETUID/SETGID/SYS_CHROOT/KILL
    # (re-run "amazon-cloudwatch-agent-ctl -a enable-ebpf" after changing it).
    javaagent:
      enabled: true
      # The Java agent's start-up (re-instrumenting loaded classes) can take more
      # than OBI's default 10s on small hosts or when JVMs start together; the
      # attach then succeeds but OBI logs "java attach timed out".
      attach_timeout: 30s

extensions:
  sigv4auth/cwagent_ebpf_monitoring:
    region: ${env:CWAGENT_REGION:-us-west-2}
    service: monitoring
  sigv4auth/cwagent_ebpf_xray:
    region: ${env:CWAGENT_REGION:-us-west-2}
    service: xray
  # Runtime switches (see the header). Credentials: the agent's default chain (instance /
  # task / pod role); the role needs ssm:GetParameter on the parameter
  # (CloudWatchAgentServerPolicy allows AmazonCloudWatch-*).
  runtimecontrol/cwagent_ebpf:
    parameter: ${env:CWAGENT_RUNTIME_PARAMETER:-}
    poll_interval: ${env:CWAGENT_RUNTIME_POLL_INTERVAL:-300s}
    region: ${env:CWAGENT_REGION:-us-west-2}

processors:
  # Each gate passes or drops its pipeline's data per batch from a runtime switch (default
  # while unknown: off). First in its pipeline, so nothing is done for dropped data.
  gate/cwagent_ebpf_traces:
    flag: traces_export
    default: false
  gate/cwagent_ebpf_emf:
    flag: emf_export
    default: false
  # Lambda Invoke by bare function name: OBI cannot know the account, so complete
  # aws.lambda.function.arn from the host's cloud.account.id (the caller's account
  # unless it uses cross-account credentials) + faas.invoked_region / _name.
  # Account and region are not copied to aws.* resource attributes: the resource has
  # cloud.account.id / cloud.region (and host.id), and CloudWatch adds @aws.account /
  # @aws.region to every datapoint.
  transform/cwagent_ebpf_lambda:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["aws.lambda.function.arn"], Concat(["arn:aws:lambda:", attributes["faas.invoked_region"], ":", resource.attributes["cloud.account.id"], ":function:", attributes["faas.invoked_name"]], "")) where attributes["aws.lambda.function.arn"] == nil and attributes["faas.invoked_name"] != nil and attributes["faas.invoked_region"] != nil and resource.attributes["cloud.account.id"] != nil
          - replace_pattern(attributes["aws.lambda.function.arn"], "^arn:aws:lambda:cn-", "arn:aws-cn:lambda:cn-") where attributes["aws.lambda.function.arn"] != nil
          - replace_pattern(attributes["aws.lambda.function.arn"], "^arn:aws:lambda:us-gov-", "arn:aws-us-gov:lambda:us-gov-") where attributes["aws.lambda.function.arn"] != nil
  # CloudWatch OTLP metrics require delta temporality; OBI emits cumulative.
  cumulativetodelta/cwagent_ebpf: {}
  # CloudWatch OTLP accepts at most 1000 datapoints per request.
  batch/cwagent_ebpf:
    timeout: 5s
    send_batch_size: 500
    send_batch_max_size: 500
  batch/cwagent_ebpf_traces:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 512
  # EMF: only the HTTP server / client request duration histograms. awsemf does not turn
  # cumulative explicit histograms into deltas (and cumulativetodelta drops their min / max,
  # which EMF would report as 0), so each histogram becomes two monotonic cumulative sums,
  # <name>_count (requests) and <name>_sum (seconds), which awsemf turns into per-period deltas.
  # Average latency = _sum / _count.
  filter/cwagent_ebpf_emf:
    error_mode: ignore
    metrics:
      metric:
        - 'not IsMatch(name, "^http[.](server|client)[.]request[.]duration$")'
  transform/cwagent_ebpf_emf:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - extract_count_metric(true) where type == METRIC_DATA_TYPE_HISTOGRAM
          - extract_sum_metric(true) where type == METRIC_DATA_TYPE_HISTOGRAM
  filter/cwagent_ebpf_emf_histograms:
    error_mode: ignore
    metrics:
      metric:
        - 'type == METRIC_DATA_TYPE_HISTOGRAM'

exporters:
  # otlp_http compresses with gzip by default.
  otlp_http/cwagent_ebpf_cloudwatch:
    metrics_endpoint: https://monitoring.${env:CWAGENT_REGION:-us-west-2}.amazonaws.com/v1/metrics
    auth:
      authenticator: sigv4auth/cwagent_ebpf_monitoring
  otlp_http/cwagent_ebpf_xray:
    traces_endpoint: https://xray.${env:CWAGENT_REGION:-us-west-2}.amazonaws.com/v1/traces
    auth:
      authenticator: sigv4auth/cwagent_ebpf_xray
  # Bounded cardinality: CloudWatch metrics only for the dimension sets below (no rollup);
  # service.name is a resource attribute, hence resource_to_telemetry_conversion (the other
  # resource attributes are fields of the log event, not dimensions).
  awsemf/cwagent_ebpf:
    region: ${env:CWAGENT_REGION:-us-west-2}
    namespace: CWAgent/eBPF
    log_group_name: /aws/cwagent/ebpf
    log_stream_name: "{ServiceName}"
    dimension_rollup_option: NoDimensionRollup
    resource_to_telemetry_conversion:
      enabled: true
    metric_declarations:
      - dimensions: [[service.name], [service.name, http.response.status_code]]
        metric_name_selectors:
          - '^http[.](server|client)[.]request[.]duration_(count|sum)$'
    metric_descriptors:
      - {metric_name: http.server.request.duration_count, unit: Count, overwrite: true}
      - {metric_name: http.client.request.duration_count, unit: Count, overwrite: true}
      - {metric_name: http.server.request.duration_sum, unit: Seconds, overwrite: true}
      - {metric_name: http.client.request.duration_sum, unit: Seconds, overwrite: true}

service:
  extensions: [sigv4auth/cwagent_ebpf_monitoring, sigv4auth/cwagent_ebpf_xray, runtimecontrol/cwagent_ebpf]
  pipelines:
    # RED metrics: always on.
    metrics/cwagent_ebpf:
      receivers: [obi/cwagent_ebpf]
      processors: [transform/cwagent_ebpf_lambda, cumulativetodelta/cwagent_ebpf, batch/cwagent_ebpf]
      exporters: [otlp_http/cwagent_ebpf_cloudwatch]
    # Spans: runtime switch traces_export.
    traces/cwagent_ebpf:
      receivers: [obi/cwagent_ebpf]
      processors: [gate/cwagent_ebpf_traces, batch/cwagent_ebpf_traces]
      exporters: [otlp_http/cwagent_ebpf_xray]
    # EMF: runtime switch emf_export.
    metrics/cwagent_ebpf_emf:
      receivers: [obi/cwagent_ebpf]
      processors: [gate/cwagent_ebpf_emf, filter/cwagent_ebpf_emf, transform/cwagent_ebpf_emf, filter/cwagent_ebpf_emf_histograms]
      exporters: [awsemf/cwagent_ebpf]
