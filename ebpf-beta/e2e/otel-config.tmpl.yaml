# CloudWatch Agent OTel YAML for the e2e test (rendered by run-e2e.sh): the agent's eBPF
# receiving side, as in etc/ebpf/receiver.yaml (OTLP/gRPC on a Unix socket), but the
# output goes only to the debug exporter (plain text on the agent's stdout); nothing is
# sent to AWS.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "@SOCKET@"
        transport: unix
exporters:
  debug:
    verbosity: detailed
    use_internal_logger: false
service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [debug]
    traces:
      receivers: [otlp]
      exporters: [debug]
  telemetry:
    logs:
      level: info
