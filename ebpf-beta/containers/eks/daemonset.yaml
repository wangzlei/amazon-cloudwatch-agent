# CloudWatch Agent eBPF beta on EKS (plan C): one DaemonSet, two containers per pod, from
# the same image (Dockerfile here). Without the amazon-cloudwatch-observability add-on.
#   cloudwatch-agent       the agent (start-amazon-cloudwatch-agent), non-root, no
#                          capabilities; receives the eBPF data on the Unix socket and
#                          sends it to CloudWatch with the pod's AWS credentials
#   cloudwatch-agent-ebpf  the eBPF process (OBI), root with only the 12 eBPF
#                          capabilities; pushes OTLP/gRPC to the socket, sends nothing to AWS
# The socket is in an emptyDir only these two containers mount.
#
# Replace <IMAGE> and <REGION>. AWS credentials: an EKS Pod Identity association (or IRSA)
# for the service account amazon-cloudwatch/cloudwatch-agent-ebpf with
# CloudWatchAgentServerPolicy. They are pod-level, so the eBPF container could read them
# too; its config sends nothing to AWS.
apiVersion: v1
kind: Namespace
metadata:
  name: amazon-cloudwatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudwatch-agent-ebpf
  namespace: amazon-cloudwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudwatch-agent-ebpf
rules:
  # OBI's Kubernetes metadata (k8s.* attributes): read-only.
  - apiGroups: [""]
    resources: [pods, services, nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  # Service address ranges: tcp_service_name is exchanged with Kubernetes Services.
  - apiGroups: [networking.k8s.io]
    resources: [servicecidrs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudwatch-agent-ebpf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudwatch-agent-ebpf
subjects:
  - kind: ServiceAccount
    name: cloudwatch-agent-ebpf
    namespace: amazon-cloudwatch
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudwatch-agent-ebpf
  namespace: amazon-cloudwatch
  labels: {app.kubernetes.io/name: cloudwatch-agent-ebpf}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: cloudwatch-agent-ebpf}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudwatch-agent-ebpf}
    spec:
      serviceAccountName: cloudwatch-agent-ebpf
      # hostPID: the eBPF process must see every process on the node (pod-level setting).
      hostPID: true
      # hostNetwork: IMDS (region, EC2 attributes, VPC CIDRs) works even with an IMDS hop
      # limit of 1. Nothing listens on the network: the agent only listens on the socket.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      nodeSelector: {kubernetes.io/os: linux}
      containers:
        - name: cloudwatch-agent
          image: <IMAGE>
          env:
            - name: CWAGENT_EBPF_ENABLED
              value: "true"
            - name: CW_CONFIG_CONTENT
              value: '{"agent":{"region":"<REGION>"}}'
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: ebpf-socket, mountPath: /opt/aws/amazon-cloudwatch-agent/var/ebpf}
        - name: cloudwatch-agent-ebpf
          image: <IMAGE>
          command: [/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ebpf,
                    -config, /opt/aws/amazon-cloudwatch-agent/ebpf/obi.yaml]
          env:
            - name: KUBE_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            # Kubernetes has no ambient capabilities: added capabilities only take effect
            # for root. Everything else is dropped.
            runAsUser: 0
            # The agent's group: the socket is 0770, owned by the agent's 10001:10001, and
            # without CAP_DAC_OVERRIDE root gets the ordinary permission checks.
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
              add: [BPF, PERFMON, SYS_PTRACE, DAC_READ_SEARCH, CHECKPOINT_RESTORE, NET_RAW,
                    NET_ADMIN, SYS_ADMIN, KILL, SYS_CHROOT, SETUID, SETGID]
            seccompProfile: {type: Unconfined}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: ebpf-socket, mountPath: /opt/aws/amazon-cloudwatch-agent/var/ebpf}
            - {name: bpffs, mountPath: /sys/fs/bpf}
            - {name: tracefs, mountPath: /sys/kernel/tracing}
            - {name: debugfs, mountPath: /sys/kernel/debug}
            # The host's cgroup2 root: in the container's own cgroup namespace OBI would
            # attach its sockops program to this container's cgroup only (no peer.service.name).
            - {name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true}
      volumes:
        - {name: ebpf-socket, emptyDir: {}}
        - {name: bpffs, hostPath: {path: /sys/fs/bpf, type: Directory}}
        - {name: tracefs, hostPath: {path: /sys/kernel/tracing}}
        - {name: debugfs, hostPath: {path: /sys/kernel/debug}}
        - {name: cgroup, hostPath: {path: /sys/fs/cgroup, type: Directory}}
