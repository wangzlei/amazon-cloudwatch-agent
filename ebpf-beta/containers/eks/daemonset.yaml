# CloudWatch Agent eBPF beta on EKS: one DaemonSet, one container - the agent with the OBI
# receiver compiled in (the image of ebpf-beta/ci/run.sh image), root with drop ALL + only the
# 12 eBPF capabilities. Without the amazon-cloudwatch-observability add-on.
# eBPF is turned on by the marker etc/ebpf/enabled (the ConfigMap below).
#
# Replace <IMAGE> and <REGION>. AWS credentials: an EKS Pod Identity association (or IRSA)
# for amazon-cloudwatch/cloudwatch-agent-ebpf with CloudWatchAgentServerPolicy.
apiVersion: v1
kind: Namespace
metadata:
  name: amazon-cloudwatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudwatch-agent-ebpf
  namespace: amazon-cloudwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudwatch-agent-ebpf
rules:
  # OBI's Kubernetes metadata (k8s.* attributes): read-only.
  - apiGroups: [""]
    resources: [pods, services, nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  # Service address ranges: tcp_service_name is exchanged with Kubernetes Services.
  - apiGroups: [networking.k8s.io]
    resources: [servicecidrs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudwatch-agent-ebpf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudwatch-agent-ebpf
subjects:
  - kind: ServiceAccount
    name: cloudwatch-agent-ebpf
    namespace: amazon-cloudwatch
---
apiVersion: v1
kind: ConfigMap
metadata: {name: cloudwatch-agent-ebpf, namespace: amazon-cloudwatch}
data:
  enabled: ""
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudwatch-agent-ebpf
  namespace: amazon-cloudwatch
  labels: {app.kubernetes.io/name: cloudwatch-agent-ebpf}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: cloudwatch-agent-ebpf}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cloudwatch-agent-ebpf}
    spec:
      serviceAccountName: cloudwatch-agent-ebpf
      # hostPID: OBI must see every process on the node (pod-level setting).
      hostPID: true
      # hostNetwork: IMDS (region, EC2 attributes, VPC CIDRs) works even with an IMDS hop
      # limit of 1.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      nodeSelector: {kubernetes.io/os: linux}
      containers:
        - name: cloudwatch-agent
          image: <IMAGE>
          env:
            - name: CW_CONFIG_CONTENT
              value: '{"agent":{"region":"<REGION>"}}'
            - name: KUBE_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            # Kubernetes has no ambient capabilities: added capabilities only take effect
            # for root. Everything else is dropped.
            runAsUser: 0
            capabilities:
              drop: [ALL]
              add: [BPF, PERFMON, SYS_PTRACE, DAC_READ_SEARCH, CHECKPOINT_RESTORE, NET_RAW,
                    NET_ADMIN, SYS_ADMIN, KILL, SYS_CHROOT, SETUID, SETGID]
            seccompProfile: {type: Unconfined}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: marker, mountPath: /opt/aws/amazon-cloudwatch-agent/etc/ebpf/enabled, subPath: enabled}
            - {name: bpffs, mountPath: /sys/fs/bpf}
            - {name: tracefs, mountPath: /sys/kernel/tracing}
            - {name: debugfs, mountPath: /sys/kernel/debug}
            # The host's cgroup2 root: in the container's own cgroup namespace OBI would
            # attach its sockops program to this container's cgroup only (no peer.service.name).
            - {name: cgroup, mountPath: /sys/fs/cgroup, readOnly: true}
      volumes:
        - {name: marker, configMap: {name: cloudwatch-agent-ebpf}}
        - {name: bpffs, hostPath: {path: /sys/fs/bpf, type: Directory}}
        - {name: tracefs, hostPath: {path: /sys/kernel/tracing}}
        - {name: debugfs, hostPath: {path: /sys/kernel/debug}}
        - {name: cgroup, hostPath: {path: /sys/fs/cgroup, type: Directory}}
