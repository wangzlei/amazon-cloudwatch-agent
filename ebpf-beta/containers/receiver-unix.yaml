# Regular (official) CloudWatch Agent, receiving side of privileged-unix.yaml: an OTLP/gRPC
# receiver on a Unix socket and a pipeline that sends the eBPF RED metrics to CloudWatch.
# Give it to the official agent as CW_OTEL_CONFIG_CONTENT (containers) or as a file in
# etc/amazon-cloudwatch-agent.d/ (EC2); the agent's JSON config stays as it is.
#
#   CWAGENT_OTLP_SOCKET  socket path, in a directory only the two agents can write
#   AWS_REGION           CloudWatch region
#
# The agent creates the socket at startup and removes it on a clean shutdown. A socket left
# by a killed agent makes the next start fail ("address already in use"): remove it before
# starting the agent.
receivers:
  otlp/cwagent_ebpf:
    protocols:
      grpc:
        endpoint: ${env:CWAGENT_OTLP_SOCKET}
        transport: unix

processors:
  # CloudWatch OTLP accepts at most 1000 datapoints per request.
  batch/cwagent_ebpf:
    timeout: 5s
    send_batch_size: 500
    send_batch_max_size: 500

exporters:
  otlp_http/cwagent_ebpf_cloudwatch:
    metrics_endpoint: https://monitoring.${env:AWS_REGION}.amazonaws.com/v1/metrics
    auth:
      authenticator: sigv4auth/cwagent_ebpf_monitoring

extensions:
  sigv4auth/cwagent_ebpf_monitoring:
    region: ${env:AWS_REGION}
    service: monitoring

service:
  extensions: [sigv4auth/cwagent_ebpf_monitoring]
  pipelines:
    metrics/cwagent_ebpf:
      receivers: [otlp/cwagent_ebpf]
      processors: [batch/cwagent_ebpf]
      exporters: [otlp_http/cwagent_ebpf_cloudwatch]
