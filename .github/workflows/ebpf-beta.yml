name: ebpf-beta

# CloudWatch Agent eBPF beta (branch ebpf-beta: CloudWatch Agent v1.300074.0 + vendored,
# patched OBI in third_party/obi). Every job runs ebpf-beta/ci/run.sh, which first
# generates OBI's BPF bindings in its pinned generator image (they are not committed).
#
#   gates  three parallel jobs: deps (tidy + dependency-version gate + vet), unit (tests),
#          cross (linux/amd64, linux/arm64, windows/amd64 builds)
#   e2e    agent with restricted capabilities on the runner's kernel (sudo + capsh)
#   rpm    make package-rpm (amd64 + arm64) -> workflow artifact
#   image  official-layout image (ebpf-beta/image/Dockerfile), linux/amd64 + arm64, pushed to
#          ghcr.io/<owner>/cloudwatch-agent-ebpf-beta:<sha7> (+ latest on branch ebpf-beta,
#          + <release> on a release run); pull requests only build and smoke-test it
#   release  manual run (Actions > ebpf-beta > Run workflow) with input "release", e.g.
#            1.300074.0-ebpfbeta.1: GitHub pre-release v<release> with the RPMs, tag created
#            on the built commit. A tag made with GITHUB_TOKEN triggers no other workflow;
#            pushing a v* tag by hand would also start upstream's record-binary-sizes /
#            hydrate-goproxy, which need CloudWatch Agent team AWS roles.
#
# Publishing to SSM Distributor stays manual (distributor/publish.sh): this workflow has
# no AWS credentials.

on:
  push:
    branches: [ebpf-beta, 'ebpf-beta/**']
  pull_request:
    branches: [ebpf-beta, 'ebpf-beta/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version (e.g. 1.300074.0-ebpfbeta.1): creates GitHub pre-release v<version>. Empty = build only.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ebpf-beta-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: gates (${{ matrix.stage }})
    strategy:
      fail-fast: false
      matrix:
        stage: [deps, unit, cross]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: ${{ matrix.stage }}
        run: ebpf-beta/ci/run.sh "${{ matrix.stage }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: logs-${{ matrix.stage }}
          path: build/ebpf-beta-logs/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: Kernel
        run: uname -a; stat -fc %T /sys/fs/cgroup; command -v capsh || sudo apt-get install -y libcap2-bin
      - name: e2e
        run: ebpf-beta/ci/run.sh e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: logs-e2e, path: build/ebpf-beta-logs/, if-no-files-found: ignore }

  rpm:
    needs: [gates, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - name: Version
        id: v
        env: { RELEASE: "${{ inputs.release }}" }
        run: |
          # release input (manual run) or 1.300074.0-ebpfbeta.<sha7>
          v=${RELEASE:-1.300074.0-ebpfbeta.${GITHUB_SHA::7}}
          [[ $v =~ ^[a-zA-Z0-9_.-]{1,128}$ ]] || { echo "invalid version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: rpm
        env: { VERSION: "${{ steps.v.outputs.version }}" }
        run: |
          command -v rpmbuild || sudo apt-get install -y rpm
          ebpf-beta/ci/run.sh rpm
      - name: Collect RPMs and tarballs
        env: { VERSION: "${{ steps.v.outputs.version }}" }
        run: |
          mkdir -p dist
          cp build/ebpf-beta/bin/linux/amd64/amazon-cloudwatch-agent.rpm "dist/amazon-cloudwatch-agent-$VERSION.x86_64.rpm"
          cp build/ebpf-beta/bin/linux/arm64/amazon-cloudwatch-agent.rpm "dist/amazon-cloudwatch-agent-$VERSION.aarch64.rpm"
          cp build/ebpf-beta/bin/linux/amd64/amazon-cloudwatch-agent.tar.gz "dist/amazon-cloudwatch-agent-$VERSION.linux-amd64.tar.gz"
          cp build/ebpf-beta/bin/linux/arm64/amazon-cloudwatch-agent.tar.gz "dist/amazon-cloudwatch-agent-$VERSION.linux-arm64.tar.gz"
          (cd dist && sha256sum *.rpm *.tar.gz | tee SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ steps.v.outputs.version }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: logs-rpm, path: build/ebpf-beta-logs/, if-no-files-found: ignore }

  image:
    needs: [gates, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: true }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == '1'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: image
        env:
          RELEASE: ${{ inputs.release }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sha=${GITHUB_SHA::7}
          export VERSION=${RELEASE:-1.300074.0-ebpfbeta.$sha}
          export IMAGE=ghcr.io/${OWNER,,}/cloudwatch-agent-ebpf-beta
          tags="$sha"
          [[ $GITHUB_REF == refs/heads/ebpf-beta ]] && tags="$tags latest"
          [[ -n $RELEASE ]] && tags="$tags $RELEASE"
          export IMAGE_TAGS=$tags IMAGE_PUSH=$PUSH
          ebpf-beta/ci/run.sh image
          if [[ $PUSH == 1 ]]; then
            for t in $tags; do echo "- \`$IMAGE:$t\`" >> "$GITHUB_STEP_SUMMARY"; done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: logs-image, path: build/ebpf-beta-logs/, if-no-files-found: ignore }

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    needs: [rpm, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rpm-${{ needs.rpm.outputs.version }}
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.rpm.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "CloudWatch Agent eBPF beta $VERSION" \
            --notes "CloudWatch Agent v1.300074.0 + OBI eBPF receiver (source: third_party/obi/ADOT_OBI_SOURCE). Image: ghcr.io/${OWNER,,}/cloudwatch-agent-ebpf-beta:$VERSION (linux/amd64, linux/arm64). Built by $RUN_URL"
